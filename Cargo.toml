[package]
name = "projector"
version = "0.1.0"
description = "A TUI for managing project launcher scripts"
authors = ["Patrik Müller <patrik.mueller@ost.ch>"]
license = "MIT"
edition = "2024"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = "0.30.2"
color-eyre = "0.6.5"
serde = { version = "1.0.229", features = ["derive"] }
directories = "6.0.0"
serde_json = "1.0.151"
edit = "0.1.5"
tokio = { version = "1.53.1", features = ["full"] }
futures = "0.3.33"
tokio-util = "0.7.19"
thiserror = "2.0.19"
arboard = "3.6.1"

[dev-dependencies]
tempfile = "3.10.1"

[lints.rust]
unsafe_code = "forbid"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
